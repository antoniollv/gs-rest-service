name: CI Build

description: >
  CI/CD workflow para build, test, publish y deploy de Spring Boot POC con soporte para artefactos WAR y JAR.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de artefacto a generar (jar o war)'
        required: true
        default: 'jar'
        type: choice
        options:
          - jar
          - war
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (JAR o WAR)
        run: |
          ./mvnw --batch-mode clean package -P${{ github.event.inputs.build_type || 'jar' }}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: |
          ./mvnw --batch-mode test

  publish:
    name: Publish (echo version)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
      - name: Extract version from pom.xml
        id: get_version
        uses: s4u/maven-version-action@v1.7.0
        with:
          filename: pom.xml
      - name: Echo version
        run: echo "App version: ${{ steps.get_version.outputs.version }}"

  deploy:
    name: Deploy (echo version)
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
      - name: Extract version from pom.xml
        id: get_version
        uses: s4u/maven-version-action@v1.7.0
        with:
          filename: pom.xml
      - name: Echo version
        run: echo "Deploying app version: ${{ steps.get_version.outputs.version }}"
