name: CI Build

description: >
  CI/CD workflow para build, test, publish y deploy de Spring Boot POC con soporte para artefactos WAR y JAR.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de artefacto a generar (jar o war)'
        required: true
        default: 'jar'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (JAR o WAR)
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ] || [ "$BUILD_TYPE" == "null" ]; then BUILD_TYPE=jar; fi
          ./mvnw --batch-mode clean package -P$BUILD_TYPE

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: |
          ./mvnw --batch-mode test

  publish:
    name: Publish (echo version)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
      - name: Extract info from pom.xml
        id: get_info
        uses: ./.github/actions/extract-maven-info
      - name: Echo app info
        run: |
          echo "App name: ${{ steps.get_info.outputs.name }}"
          echo "App version: ${{ steps.get_info.outputs.version }}"
          echo "App artifact: ${{ steps.get_info.outputs.artifact }}"
      - name: Remove -SNAPSHOT from version (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            NEW_VERSION="${VERSION/-SNAPSHOT/}"
            ./mvnw versions:set -DnewVersion=$NEW_VERSION -DgenerateBackupPoms=false
            echo "Updated version to $NEW_VERSION for release"

  deploy:
    name: Deploy (echo version)
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
      - name: Extract info from pom.xml
        id: get_info
        uses: ./.github/actions/extract-maven-info
      - name: Echo app info
        run: |
          echo "Deploying app name: ${{ steps.get_info.outputs.name }}"
          echo "Deploying app version: ${{ steps.get_info.outputs.version }}"
          echo "Deploying app artifact: ${{ steps.get_info.outputs.artifact }}"
      - name: Publish to Maven feed
        run: |
          echo '<settings><servers><server><id>repo</id><username>${{ secrets.MAVEN_REPO_USER }}</username><password>${{ secrets.MAVEN_REPO_PASS }}</password></server></servers></settings>' > $HOME/.m2/settings.xml
          ./mvnw deploy -P${{ github.ref == 'refs/heads/main' && 'pro' || 'dev' }} --settings $HOME/.m2/settings.xml
        env:
          MAVEN_REPO_URL: ${{ secrets.MAVEN_REPO_URL }}

