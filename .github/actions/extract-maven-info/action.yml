name: 'Extract Maven Info'
description: 'Composite action to extract app name, version, and artifact (with extension) from pom.xml using Maven.'
inputs:
  maven-wrapper:
    description: 'Path to mvnw (default: ./mvnw)'
    required: false
    default: './mvnw'
outputs:
  name:
    description: 'App name from pom.xml'
    value: ${{ steps.extract.outputs.name }}
  version:
    description: 'App version from pom.xml'
    value: ${{ steps.extract.outputs.version }}
  artifact:
    description: 'App artifact from pom.xml or constructed, with extension'
    value: ${{ steps.extract.outputs.artifact }}
runs:
  using: 'composite'
  steps:
    - id: extract
      shell: bash
      run: |
        MVNW="${{ inputs.maven-wrapper }}"
        APP_NAME=$($MVNW help:evaluate -Dexpression=project.name -q -DforceStdout)
        APP_VERSION=$($MVNW help:evaluate -Dexpression=project.version -q -DforceStdout)
        APP_ARTIFACT=$($MVNW help:evaluate -Dexpression=project.build.finalName -q -DforceStdout)
        if [ -z "$APP_ARTIFACT" ] || [ "$APP_ARTIFACT" == "null" ]; then
          APP_ARTIFACT=$($MVNW help:evaluate -Dexpression=project.artifactId -q -DforceStdout)-$APP_VERSION
        fi
        PACKAGING=$($MVNW help:evaluate -Dexpression=project.packaging -q -DforceStdout)
        if [ -z "$PACKAGING" ] || [ "$PACKAGING" == "null" ]; then
          PACKAGING=jar
        fi
        ARTIFACT_FULL="$APP_ARTIFACT.$PACKAGING"
        echo "name=$APP_NAME" >> $GITHUB_OUTPUT
        echo "version=$APP_VERSION" >> $GITHUB_OUTPUT
        echo "artifact=$ARTIFACT_FULL" >> $GITHUB_OUTPUT
